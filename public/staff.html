<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>S.C.A.G.S.S Staff Portal</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f7fc;
  color:#17324d;
}

header{
  background:#0b5ed7;
  color:white;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-weight:900;
}

.logout{
  background:transparent;
  color:white;
  border:1px solid rgba(255,255,255,.6);
  border-radius:8px;
  padding:7px 11px;
  cursor:pointer;
}

.container{
  max-width:1050px;
  margin:auto;
  padding:20px;
}

.welcome{
  background:white;
  padding:20px;
  border-radius:15px;
  border:1px solid #dfe9f3;
  margin-bottom:15px;
}

h1{
  color:#084b9b;
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:14px;
}

.card{
  background:#fff;
  border:1px solid #dfe9f3;
  border-radius:14px;
  padding:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.card h3{
  margin:0 0 8px;
  color:#6b8194;
  font-size:13px;
}

.value{
  font-size:23px;
  font-weight:900;
  color:#0b5ed7;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

button.action{
  padding:16px;
  border:0;
  border-radius:11px;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.clockin{
  background:#198754;
}

.clockout{
  background:#dc3545;
}

button:disabled{
  opacity:.5;
}

.status{
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  background:#eef6ff;
  color:#27577f;
  line-height:1.5;
}

.table-wrap{
  margin-top:15px;
  overflow:auto;
  background:#fff;
  border-radius:13px;
  border:1px solid #dfe9f3;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #edf1f5;
  text-align:left;
  font-size:13px;
}

th{
  background:#eef6ff;
}

.profile{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:10px;
}

.profile-item{
  background:#f7fbff;
  padding:12px;
  border-radius:9px;
}

.profile-item strong{
  display:block;
  font-size:11px;
  color:#6c8194;
  margin-bottom:4px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .profile{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .container{
    padding:12px;
  }

}

</style>
</head>

<body>

<header>

  <div class="brand">
    S.C.A.G.S.S STAFF PORTAL
  </div>

  <button
    class="logout"
    onclick="logout()">
    Logout
  </button>

</header>

<div class="container">

  <div class="welcome">

    <h1>
      Welcome,
      <span id="teacherName">
        Staff Member
      </span>
    </h1>

    <div
      id="profileBox"
      class="profile">
    </div>

  </div>

  <div class="grid">

    <div class="card">

      <h3>
        Today's Clock In
      </h3>

      <div
        class="value"
        id="todayIn">
        -
      </div>

    </div>

    <div class="card">

      <h3>
        Today's Clock Out
      </h3>

      <div
        class="value"
        id="todayOut">
        -
      </div>

    </div>

    <div class="card">

      <h3>
        GPS Status
      </h3>

      <div
        class="value"
        id="gpsStatus">
        -
      </div>

    </div>

  </div>

  <div class="card" style="margin-top:15px">

    <h3>
      Attendance Actions
    </h3>

    <div class="actions">

      <button
        id="clockInButton"
        class="action clockin"
        onclick="clockIn()">
        CLOCK IN
      </button>

      <button
        id="clockOutButton"
        class="action clockout"
        onclick="clockOut()">
        CLOCK OUT
      </button>

    </div>

    <div
      id="status"
      class="status">
      GPS verification is required for clock in and clock out.
    </div>

  </div>

  <div class="card" style="margin-top:15px">

    <h3>
      My Attendance History
    </h3>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Date</th>
            <th>Clock In</th>
            <th>Clock Out</th>
            <th>GPS</th>
            <th>In Distance</th>
            <th>Out Distance</th>
          </tr>

        </thead>

        <tbody
          id="attendanceTable">
        </tbody>

      </table>

    </div>

  </div>

</div>

<script>

let attendanceData = [];
let profileData = null;

async function api(
  url,
  options={}
){

  const response =
    await fetch(
      "/api" + url,
      {
        credentials:"include",
        ...options
      }
    );

  const data =
    await response.json()
      .catch(() => ({}));

  if(
    response.status === 401
  ){

    window.location.href =
      "/";

    throw new Error(
      "Session expired."
    );
  }

  if(!response.ok){

    throw new Error(
      data.message ||
      "Request failed."
    );
  }

  return data;
}

function todayKenya(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Africa/Nairobi",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(
      new Date()
    );

  const values = {};

  parts.forEach(
    part => {
      values[part.type] =
        part.value;
    }
  );

  return `${values.year}-${values.month}-${values.day}`;
}

async function loadProfile(){

  try{

    const data =
      await api("/me");

    profileData =
      data.user;

    if(
      String(
        profileData.role || ""
      ).toLowerCase()
      === "admin"
    ){

      window.location.href =
        "/admin.html";

      return;
    }

    document
      .getElementById(
        "teacherName"
      )
      .textContent =
        profileData.full_name ||
        profileData.username ||
        "Staff Member";

    document
      .getElementById(
        "profileBox"
      )
      .innerHTML = `

        <div class="profile-item">
          <strong>Username</strong>
          ${escapeHTML(
            profileData.username || "-"
          )}
        </div>

        <div class="profile-item">
          <strong>Email</strong>
          ${escapeHTML(
            profileData.email || "-"
          )}
        </div>

        <div class="profile-item">
          <strong>Phone</strong>
          ${escapeHTML(
            profileData.phone || "-"
          )}
        </div>

        <div class="profile-item">
          <strong>Account</strong>
          ${
            profileData.active
              ? "ACTIVE"
              : "PENDING"
          }
        </div>

      `;

  }catch(error){

    window.location.href =
      "/";

  }
}

async function loadAttendance(){

  try{

    const data =
      await api(
        "/attendance/my"
      );

    attendanceData =
      data.attendance || [];

    renderAttendance();

  }catch(error){

    showStatus(
      error.message
    );

  }
}

function renderAttendance(){

  const table =
    document.getElementById(
      "attendanceTable"
    );

  table.innerHTML = "";

  const today =
    todayKenya();

  const todayRecord =
    attendanceData.find(
      record =>
        record.attendance_date
        === today
    );

  document
    .getElementById(
      "todayIn"
    )
    .textContent =
      todayRecord?.clock_in
        ? formatDateTime(
            todayRecord.clock_in
          )
        : "-";

  document
    .getElementById(
      "todayOut"
    )
    .textContent =
      todayRecord?.clock_out
        ? formatDateTime(
            todayRecord.clock_out
          )
        : "-";

  document
    .getElementById(
      "gpsStatus"
    )
    .textContent =
      todayRecord?.gps_verified
        ? "VERIFIED"
        : "NOT VERIFIED";

  if(todayRecord?.clock_in){

    document
      .getElementById(
        "clockInButton"
      )
      .disabled = true;

  }else{

    document
      .getElementById(
        "clockInButton"
      )
      .disabled = false;

  }

  if(
    !todayRecord?.clock_in ||
    todayRecord?.clock_out
  ){

    document
      .getElementById(
        "clockOutButton"
      )
      .disabled = true;

  }else{

    document
      .getElementById(
        "clockOutButton"
      )
      .disabled = false;

  }

  attendanceData.forEach(
    item => {

      const row =
        document.createElement(
          "tr"
        );

      row.innerHTML = `

        <td>
          ${escapeHTML(
            item.attendance_date || ""
          )}
        </td>

        <td>
          ${formatDateTime(
            item.clock_in
          )}
        </td>

        <td>
          ${formatDateTime(
            item.clock_out
          )}
        </td>

        <td>
          ${
            item.gps_verified
              ? "VERIFIED"
              : "NOT VERIFIED"
          }
        </td>

        <td>
          ${formatDistance(
            item.clock_in_distance
          )}
        </td>

        <td>
          ${formatDistance(
            item.clock_out_distance
          )}
        </td>

      `;

      table.appendChild(
        row
      );

    }
  );
}

function getLocation(){

  return new Promise(
    (resolve,reject) => {

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            "GPS is not supported by this browser."
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        error => {

          let message =
            "Unable to get your location.";

          if(
            error.code ===
            error.PERMISSION_DENIED
          ){
            message =
              "GPS permission was denied. Please allow location access.";
          }

          if(
            error.code ===
            error.POSITION_UNAVAILABLE
          ){
            message =
              "Your GPS position is unavailable.";
          }

          if(
            error.code ===
            error.TIMEOUT
          ){
            message =
              "GPS request timed out. Please try again.";
          }

          reject(
            new Error(message)
          );

        },
        {
          enableHighAccuracy:true,
          timeout:20000,
          maximumAge:0
        }
      );

    }
  );
}

async function clockIn(){

  const button =
    document.getElementById(
      "clockInButton"
    );

  button.disabled = true;

  showStatus(
    "Getting your GPS location..."
  );

  try{

    const position =
      await getLocation();

    showStatus(
      "Verifying your location..."
    );

    const data =
      await api(
        "/attendance/clock-in",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({

              latitude:
                position.coords.latitude,

              longitude:
                position.coords.longitude,

              accuracy:
                position.coords.accuracy

            })
        }
      );

    showStatus(
      `${data.message} Distance from school: ${data.distance} metres.`
    );

    await loadAttendance();

  }catch(error){

    showStatus(
      error.message
    );

    button.disabled = false;

  }
}

async function clockOut(){

  const button =
    document.getElementById(
      "clockOutButton"
    );

  button.disabled = true;

  showStatus(
    "Getting your GPS location..."
  );

  try{

    const position =
      await getLocation();

    showStatus(
      "Verifying your location..."
    );

    const data =
      await api(
        "/attendance/clock-out",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({

              latitude:
                position.coords.latitude,

              longitude:
                position.coords.longitude,

              accuracy:
                position.coords.accuracy

            })
        }
      );

    showStatus(
      `${data.message} Distance from school: ${data.distance} metres.`
    );

    await loadAttendance();

  }catch(error){

    showStatus(
      error.message
    );

    button.disabled = false;

  }
}

function showStatus(
  message
){

  document
    .getElementById(
      "status"
    )
    .textContent =
      message;
}

async function logout(){

  try{

    await fetch(
      "/api/auth/logout",
      {
        method:"POST",
        credentials:"include"
      }
    );

  }finally{

    window.location.href =
      "/";

  }
}

function formatDateTime(
  value
){

  if(!value)
    return "-";

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return value;
  }

  return date.toLocaleString(
    "en-KE",
    {
      timeZone:
        "Africa/Nairobi"
    }
  );
}

function formatDistance(
  value
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "-";
  }

  return `${Math.round(
    Number(value)
  )} m`;
}

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

async function start(){

  await loadProfile();
  await loadAttendance();

}

start();

</script>

</body>
</html>
