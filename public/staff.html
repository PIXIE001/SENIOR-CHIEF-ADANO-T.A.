<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.C.A.G.S.S Staff Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f7fb;
      color: #17324d;
    }

    header {
      background: linear-gradient(135deg, #0877c9, #07579a);
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    header h1 {
      font-size: 20px;
    }

    header p {
      font-size: 13px;
      opacity: .9;
      margin-top: 4px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      background: white;
      color: #07579a;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .welcome h2 {
      color: #07579a;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #61778c;
    }

    .status-card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .status-label {
      font-size: 13px;
      color: #70879a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .status.not-clocked {
      color: #d97706;
    }

    .status.clocked-in {
      color: #16803a;
    }

    .status.clocked-out {
      color: #1769aa;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .clock-in {
      background: #0877c9;
      color: white;
      min-width: 150px;
    }

    .clock-out {
      background: #16803a;
      color: white;
      min-width: 150px;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.info {
      background: #e8f3fc;
      color: #07579a;
    }

    .message.success {
      background: #e7f7ed;
      color: #12652e;
    }

    .message.error {
      background: #fdecec;
      color: #a52626;
    }

    .gps-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .gps-card h3,
    .history-card h3 {
      color: #07579a;
      margin-bottom: 15px;
    }

    .gps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .gps-item {
      background: #f4f8fb;
      border-radius: 10px;
      padding: 13px;
    }

    .gps-item span {
      display: block;
      font-size: 12px;
      color: #70879a;
      margin-bottom: 5px;
    }

    .gps-item strong {
      font-size: 14px;
      word-break: break-word;
    }

    .history-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e6edf3;
      text-align: left;
      font-size: 13px;
    }

    th {
      color: #547087;
      background: #f7fafc;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge.present {
      background: #e5f7eb;
      color: #16743a;
    }

    .badge.late {
      background: #fff1d6;
      color: #9b6100;
    }

    .badge.out {
      background: #e7f1fb;
      color: #1769aa;
    }

    .empty {
      text-align: center;
      color: #71879a;
      padding: 25px;
    }

    .loading {
      opacity: .65;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
      }

      header h1 {
        font-size: 17px;
      }

      .status {
        font-size: 25px;
      }

      main {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>S.C.A.G.S.S STAFF PORTAL</h1>
    <p>Staff Attendance & GPS Verification</p>
  </div>

  <button class="logout" onclick="logout()">Logout</button>
</header>

<main>

  <section class="welcome">
    <h2 id="welcomeName">Loading...</h2>
    <p id="welcomeUsername"></p>
  </section>

  <section class="status-card">

    <div class="status-label">Today's Attendance Status</div>

    <div id="attendanceStatus" class="status not-clocked">
      CHECKING...
    </div>

    <div class="actions">

      <button
        id="clockInBtn"
        class="clock-in"
        onclick="clockIn()"
        disabled
      >
        CLOCK IN
      </button>

      <button
        id="clockOutBtn"
        class="clock-out"
        onclick="clockOut()"
        disabled
      >
        CLOCK OUT
      </button>

    </div>

    <div id="message" class="message"></div>

  </section>

  <section class="gps-card">

    <h3>GPS Verification</h3>

    <div class="gps-grid">

      <div class="gps-item">
        <span>GPS Status</span>
        <strong id="gpsStatus">Waiting...</strong>
      </div>

      <div class="gps-item">
        <span>Latitude</span>
        <strong id="latitude">—</strong>
      </div>

      <div class="gps-item">
        <span>Longitude</span>
        <strong id="longitude">—</strong>
      </div>

      <div class="gps-item">
        <span>Accuracy</span>
        <strong id="accuracy">—</strong>
      </div>

      <div class="gps-item">
        <span>Distance From School</span>
        <strong id="distance">—</strong>
      </div>

      <div class="gps-item">
        <span>Clock-In Time</span>
        <strong id="clockInTime">—</strong>
      </div>

      <div class="gps-item">
        <span>Clock-Out Time</span>
        <strong id="clockOutTime">—</strong>
      </div>

    </div>

  </section>

  <section class="history-card">

    <h3>Attendance History</h3>

    <div id="historyContainer">
      <div class="empty">Loading attendance history...</div>
    </div>

  </section>

</main>

<script>

let currentUser = null;
let currentAttendance = null;
let actionInProgress = false;


/* =========================================================
   BASIC HELPERS
========================================================= */

function showMessage(text, type = "info") {

  const box = document.getElementById("message");

  box.textContent = text;
  box.className = `message show ${type}`;
}


function hideMessage() {

  const box = document.getElementById("message");

  box.textContent = "";
  box.className = "message";
}


function formatTime(value) {

  if (!value) return "—";

  return new Date(value).toLocaleTimeString("en-KE", {
    timeZone: "Africa/Nairobi",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });
}


function formatDate(value) {

  if (!value) return "—";

  const date = new Date(`${value}T00:00:00+03:00`);

  return date.toLocaleDateString("en-KE", {
    timeZone: "Africa/Nairobi",
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   API
========================================================= */

async function api(url, options = {}) {

  const response = await fetch(url, {
    credentials: "include",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  let data = null;

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {

    throw new Error(
      data.message || "Request failed."
    );
  }

  return data;
}


/* =========================================================
   LOAD USER
========================================================= */

async function loadUser() {

  try {

    const data = await api("/api/me");

    currentUser = data.user;

    if (currentUser.role === "admin") {

      window.location.href = "/admin.html";
      return;
    }

    document.getElementById("welcomeName").textContent =
      `Welcome, ${currentUser.full_name}`;

    document.getElementById("welcomeUsername").textContent =
      `Username: ${currentUser.username}`;

    await loadTodayAttendance();

    await loadHistory();

  } catch (error) {

    window.location.href = "/";

  }
}


/* =========================================================
   LOAD TODAY'S ATTENDANCE
========================================================= */

async function loadTodayAttendance() {

  try {

    const data = await api(
      "/api/attendance/today"
    );

    currentAttendance = data.attendance || null;

    updateAttendanceInterface();

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

  }
}


/* =========================================================
   UPDATE STAFF STATE
========================================================= */

function updateAttendanceInterface() {

  const status =
    document.getElementById("attendanceStatus");

  const clockInBtn =
    document.getElementById("clockInBtn");

  const clockOutBtn =
    document.getElementById("clockOutBtn");

  const clockInTime =
    document.getElementById("clockInTime");

  const clockOutTime =
    document.getElementById("clockOutTime");


  /* -----------------------------------------------
     NO ATTENDANCE TODAY
  ------------------------------------------------ */

  if (!currentAttendance) {

    status.textContent = "NOT CLOCKED IN";

    status.className =
      "status not-clocked";

    clockInBtn.disabled = false;

    clockOutBtn.disabled = true;

    clockInTime.textContent = "—";
    clockOutTime.textContent = "—";

    return;
  }


  /* -----------------------------------------------
     CLOCKED OUT
  ------------------------------------------------ */

  if (currentAttendance.clock_out) {

    status.textContent = "CLOCKED OUT";

    status.className =
      "status clocked-out";

    clockInBtn.disabled = true;

    clockOutBtn.disabled = true;

    clockInTime.textContent =
      formatTime(currentAttendance.clock_in);

    clockOutTime.textContent =
      formatTime(currentAttendance.clock_out);

    updateGPSDisplay(
      currentAttendance.clock_out_lat,
      currentAttendance.clock_out_lon,
      currentAttendance.clock_out_accuracy,
      currentAttendance.clock_out_distance,
      currentAttendance.gps_verified
    );

    return;
  }


  /* -----------------------------------------------
     CLOCKED IN
  ------------------------------------------------ */

  if (currentAttendance.clock_in) {

    status.textContent = "CLOCKED IN";

    status.className =
      "status clocked-in";

    clockInBtn.disabled = true;

    clockOutBtn.disabled = false;

    clockInTime.textContent =
      formatTime(currentAttendance.clock_in);

    clockOutTime.textContent = "—";

    updateGPSDisplay(
      currentAttendance.clock_in_lat,
      currentAttendance.clock_in_lon,
      currentAttendance.clock_in_accuracy,
      currentAttendance.clock_in_distance,
      currentAttendance.gps_verified
    );

    return;
  }


  /* -----------------------------------------------
     FALLBACK
  ------------------------------------------------ */

  status.textContent = "NOT CLOCKED IN";

  status.className =
    "status not-clocked";

  clockInBtn.disabled = false;
  clockOutBtn.disabled = true;
}


/* =========================================================
   GPS DISPLAY
========================================================= */

function updateGPSDisplay(
  latitude,
  longitude,
  accuracy,
  distance,
  verified
) {

  document.getElementById("latitude").textContent =
    latitude != null
      ? Number(latitude).toFixed(6)
      : "—";

  document.getElementById("longitude").textContent =
    longitude != null
      ? Number(longitude).toFixed(6)
      : "—";

  document.getElementById("accuracy").textContent =
    accuracy != null
      ? `${Math.round(Number(accuracy))} m`
      : "—";

  document.getElementById("distance").textContent =
    distance != null
      ? `${Math.round(Number(distance))} m`
      : "—";

  document.getElementById("gpsStatus").textContent =
    verified
      ? "GPS VERIFIED"
      : "Not verified";
}


/* =========================================================
   GET GPS
========================================================= */

function getLocation() {

  return new Promise((resolve, reject) => {

    if (!navigator.geolocation) {

      reject(
        new Error(
          "Geolocation is not supported by this browser."
        )
      );

      return;
    }


    navigator.geolocation.getCurrentPosition(

      position => {

        const {
          latitude,
          longitude,
          accuracy
        } = position.coords;


        if (
          typeof latitude !== "number" ||
          typeof longitude !== "number" ||
          typeof accuracy !== "number" ||
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude) ||
          !Number.isFinite(accuracy)
        ) {

          reject(
            new Error(
              "Valid GPS coordinates and accuracy are required."
            )
          );

          return;
        }


        if (
          latitude < -90 ||
          latitude > 90 ||
          longitude < -180 ||
          longitude > 180
        ) {

          reject(
            new Error(
              "Invalid GPS coordinates received."
            )
          );

          return;
        }


        document.getElementById("latitude").textContent =
          latitude.toFixed(6);

        document.getElementById("longitude").textContent =
          longitude.toFixed(6);

        document.getElementById("accuracy").textContent =
          `${Math.round(accuracy)} m`;

        document.getElementById("gpsStatus").textContent =
          "GPS LOCATION RECEIVED";


        resolve({
          latitude,
          longitude,
          accuracy
        });

      },

      error => {

        let message =
          "Unable to get your GPS location.";

        if (
          error.code ===
          error.PERMISSION_DENIED
        ) {

          message =
            "Location permission was denied. Allow location access and try again.";

        } else if (
          error.code ===
          error.POSITION_UNAVAILABLE
        ) {

          message =
            "GPS location is currently unavailable. Turn on Location and try again.";

        } else if (
          error.code ===
          error.TIMEOUT
        ) {

          message =
            "GPS location timed out. Move to an open area and try again.";
        }

        reject(new Error(message));

      },

      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }

    );

  });
}


/* =========================================================
   CLOCK IN
========================================================= */

async function clockIn() {

  if (actionInProgress) return;

  if (currentAttendance?.clock_in) {

    showMessage(
      "You are already clocked in today.",
      "error"
    );

    updateAttendanceInterface();

    return;
  }


  actionInProgress = true;

  const button =
    document.getElementById("clockInBtn");

  button.disabled = true;

  showMessage(
    "Getting your GPS location. Please wait...",
    "info"
  );


  try {

    const location =
      await getLocation();


    showMessage(
      "GPS received. Verifying your attendance...",
      "info"
    );


    const data = await api(
      "/api/attendance/clock-in",
      {
        method: "POST",

        body: JSON.stringify({
          latitude: location.latitude,
          longitude: location.longitude,
          accuracy: location.accuracy
        })
      }
    );


    currentAttendance =
      data.attendance;


    updateAttendanceInterface();


    showMessage(
      "Clock-in successful. You are now CLOCKED IN.",
      "success"
    );


    await loadHistory();


  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

    updateAttendanceInterface();

  } finally {

    actionInProgress = false;

  }
}


/* =========================================================
   CLOCK OUT
========================================================= */

async function clockOut() {

  if (actionInProgress) return;


  if (!currentAttendance?.clock_in) {

    showMessage(
      "You must clock in before clocking out.",
      "error"
    );

    return;
  }


  if (currentAttendance?.clock_out) {

    showMessage(
      "You have already clocked out today.",
      "error"
    );

    return;
  }


  actionInProgress = true;

  const button =
    document.getElementById("clockOutBtn");

  button.disabled = true;

  showMessage(
    "Getting your GPS location. Please wait...",
    "info"
  );


  try {

    const location =
      await getLocation();


    showMessage(
      "GPS received. Recording clock-out...",
      "info"
    );


    const data = await api(
      "/api/attendance/clock-out",
      {
        method: "POST",

        body: JSON.stringify({
          latitude: location.latitude,
          longitude: location.longitude,
          accuracy: location.accuracy
        })
      }
    );


    currentAttendance =
      data.attendance;


    updateAttendanceInterface();


    showMessage(
      "Clock-out successful. Your attendance for today is complete.",
      "success"
    );


    await loadHistory();


  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

    updateAttendanceInterface();

  } finally {

    actionInProgress = false;

  }
}


/* =========================================================
   ATTENDANCE HISTORY
========================================================= */

async function loadHistory() {

  const container =
    document.getElementById("historyContainer");

  try {

    const data =
      await api(
        "/api/attendance/history"
      );

    const records =
      data.attendance || [];


    if (!records.length) {

      container.innerHTML =
        `<div class="empty">
          No attendance records yet.
        </div>`;

      return;
    }


    let html = `
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Clock In</th>
            <th>Clock Out</th>
            <th>Status</th>
            <th>GPS</th>
            <th>Distance</th>
          </tr>
        </thead>
        <tbody>
    `;


    records.forEach(record => {

      let badgeClass =
        record.status === "Late"
          ? "late"
          : "present";

      if (record.clock_out) {
        badgeClass = "out";
      }


      html += `
        <tr>

          <td>
            ${escapeHTML(
              formatDate(record.attendance_date)
            )}
          </td>

          <td>
            ${escapeHTML(
              formatTime(record.clock_in)
            )}
          </td>

          <td>
            ${escapeHTML(
              formatTime(record.clock_out)
            )}
          </td>

          <td>
            <span class="badge ${badgeClass}">
              ${escapeHTML(
                record.clock_out
                  ? "Clocked Out"
                  : record.status || "Present"
              )}
            </span>
          </td>

          <td>
            ${
              record.gps_verified
                ? "Verified"
                : "Not verified"
            }
          </td>

          <td>
            ${
              record.clock_in_distance != null
                ? Math.round(
                    Number(
                      record.clock_in_distance
                    )
                  ) + " m"
                : "—"
            }
          </td>

        </tr>
      `;

    });


    html += `
        </tbody>
      </table>
    `;


    container.innerHTML = html;


  } catch (error) {

    container.innerHTML =
      `<div class="empty">
        Unable to load attendance history.
      </div>`;

  }
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  try {

    await api(
      "/api/auth/logout",
      {
        method: "POST"
      }
    );

  } catch {
    // Continue to login even if logout request fails.
  }

  window.location.href = "/";

}


/* =========================================================
   AUTOMATIC STATE REFRESH
========================================================= */

setInterval(async () => {

  if (
    currentUser &&
    !actionInProgress
  ) {

    try {

      const data =
        await api(
          "/api/attendance/today"
        );

      currentAttendance =
        data.attendance || null;

      updateAttendanceInterface();

    } catch {
      // Ignore background refresh errors.
    }

  }

}, 10000);


/* =========================================================
   START
========================================================= */

loadUser();

</script>

</body>
</html>
