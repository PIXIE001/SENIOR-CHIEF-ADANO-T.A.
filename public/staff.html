<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Staff Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f9fc;
      color: #17384d;
    }

    header {
      background: #0877b8;
      color: white;
      padding: 20px;
    }

    header .top {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      font-size: 21px;
    }

    .logout {
      width: auto;
      padding: 10px 16px;
      border: 1px solid white;
      background: transparent;
      border-radius: 10px;
      color: white;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 18px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-bottom: 6px;
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow:
        0 8px 30px
        rgba(0,70,110,0.08);
    }

    .card h3 {
      color: #0877b8;
      margin-bottom: 12px;
    }

    .status {
      padding: 12px;
      background: #edf7fc;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: #0877b8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .clock-out {
      background: #145d82;
    }

    #message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    th,
    td {
      padding: 11px;
      border-bottom:
        1px solid #e2ebef;
      text-align: left;
    }

    th {
      background: #edf7fc;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .gps {
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<header>
  <div class="top">

    <h1>
      S.C.A.G.S.S STAFF PORTAL
    </h1>

    <button
      class="logout"
      onclick="logout()"
    >
      LOG OUT
    </button>

  </div>
</header>

<main>

  <section class="welcome">
    <h2 id="name">
      Loading...
    </h2>

    <p id="date"></p>
  </section>

  <section class="cards">

    <div class="card">

      <h3>Today's Attendance</h3>

      <div
        id="attendanceStatus"
        class="status"
      >
        Checking...
      </div>

      <button
        id="clockInButton"
        onclick="clockIn()"
      >
        CLOCK IN
      </button>

      <br><br>

      <button
        id="clockOutButton"
        class="clock-out"
        onclick="clockOut()"
      >
        CLOCK OUT
      </button>

      <div
        id="message"
      ></div>

    </div>

    <div class="card">

      <h3>GPS Verification</h3>

      <div class="gps">

        <div>
          Latitude:
          <strong id="latitude">
            —
          </strong>
        </div>

        <div>
          Longitude:
          <strong id="longitude">
            —
          </strong>
        </div>

        <div>
          Accuracy:
          <strong id="accuracy">
            —
          </strong>
        </div>

        <div>
          School Distance:
          <strong id="distance">
            —
          </strong>
        </div>

        <div>
          Verification:
          <strong id="verified">
            —
          </strong>
        </div>

      </div>

    </div>

  </section>

  <section class="card">

    <h3>Attendance History</h3>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Clock In</th>
            <th>Clock Out</th>
            <th>Status</th>
            <th>GPS</th>
          </tr>
        </thead>

        <tbody id="history">
        </tbody>

      </table>

    </div>

  </section>

</main>

<script>
  let currentUser = null;

  async function api(
    url,
    options = {}
  ) {
    const response =
      await fetch(
        url,
        {
          ...options,
          credentials:
            "include"
        }
      );

    const data =
      await response.json()
        .catch(
          () => ({})
        );

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Request failed"
      );
    }

    return data;
  }

  function showMessage(
    text,
    success = false
  ) {
    const box =
      document.getElementById(
        "message"
      );

    box.textContent = text;
    box.style.display =
      "block";

    box.style.background =
      success
        ? "#e8f8ef"
        : "#fff0f0";

    box.style.color =
      success
        ? "#167442"
        : "#a52222";
  }

  async function loadUser() {
    try {
      const data =
        await api(
          "/api/me"
        );

      currentUser =
        data.user;

      if (
        currentUser.role ===
        "admin"
      ) {
        window.location.href =
          "/admin.html";
        return;
      }

      document.getElementById(
        "name"
      ).textContent =
        currentUser.full_name;

      document.getElementById(
        "date"
      ).textContent =
        new Date().toLocaleDateString(
          "en-KE",
          {
            weekday:
              "long",
            year:
              "numeric",
            month:
              "long",
            day:
              "numeric"
          }
        );

    } catch {
      window.location.href =
        "/";
    }
  }

  function getLocation() {
    return new Promise(
      (
        resolve,
        reject
      ) => {

        if (
          !navigator.geolocation
        ) {
          reject(
            new Error(
              "GPS is not supported on this device"
            )
          );

          return;
        }

        navigator.geolocation.getCurrentPosition(
          position => {
            resolve({
              lat:
                position.coords
                  .latitude,

              lon:
                position.coords
                  .longitude,

              accuracy:
                position.coords
                  .accuracy
            });
          },

          error => {
            reject(
              new Error(
                "Unable to get GPS location. Please enable location services and allow browser permission."
              )
            );
          },

          {
            enableHighAccuracy:
              true,

            timeout:
              15000,

            maximumAge:
              0
          }
        );

      }
    );
  }

  async function clockIn() {

    const button =
      document.getElementById(
        "clockInButton"
      );

    button.disabled =
      true;

    button.textContent =
      "VERIFYING GPS...";

    try {

      const location =
        await getLocation();

      updateGPS(
        location
      );

      const data =
        await api(
          "/api/attendance/clock-in",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                location
              )
          }
        );

      showMessage(
        data.message,
        true
      );

      displayAttendance(
        data.attendance
      );

      loadHistory();

    } catch (error) {

      showMessage(
        error.message
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        "CLOCK IN";
    }
  }

  async function clockOut() {

    const button =
      document.getElementById(
        "clockOutButton"
      );

    button.disabled =
      true;

    button.textContent =
      "VERIFYING GPS...";

    try {

      const location =
        await getLocation();

      updateGPS(
        location
      );

      const data =
        await api(
          "/api/attendance/clock-out",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                location
              )
          }
        );

      showMessage(
        data.message,
        true
      );

      displayAttendance(
        data.attendance
      );

      loadHistory();

    } catch (error) {

      showMessage(
        error.message
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        "CLOCK OUT";
    }
  }

  function updateGPS(
    location
  ) {
    document.getElementById(
      "latitude"
    ).textContent =
      location.lat.toFixed(6);

    document.getElementById(
      "longitude"
    ).textContent =
      location.lon.toFixed(6);

    document.getElementById(
      "accuracy"
    ).textContent =
      Math.round(
        location.accuracy
      ) +
      " m";

    document.getElementById(
      "verified"
    ).textContent =
      "Checking...";
  }

  function displayAttendance(
    attendance
  ) {

    document.getElementById(
      "attendanceStatus"
    ).textContent =
      attendance.status ||
      "RECORDED";

    if (
      attendance.clock_in_distance
    ) {
      document.getElementById(
        "distance"
      ).textContent =
        attendance.clock_in_distance +
        " m";
    }

    document.getElementById(
      "verified"
    ).textContent =
      attendance.gps_verified
        ? "VERIFIED"
        : "NOT VERIFIED";
  }

  async function loadHistory() {

    try {

      const data =
        await api(
          "/api/attendance/history"
        );

      const body =
        document.getElementById(
          "history"
        );

      body.innerHTML = "";

      data.attendance.forEach(
        record => {

          const row =
            document.createElement(
              "tr"
            );

          row.innerHTML = `
            <td>${record.attendance_date || ""}</td>
            <td>${formatDate(record.clock_in)}</td>
            <td>${formatDate(record.clock_out)}</td>
            <td>${record.status || ""}</td>
            <td>${record.gps_verified ? "Verified" : "—"}</td>
          `;

          body.appendChild(
            row
          );
        }
      );

    } catch (error) {

      console.error(
        error
      );
    }
  }

  function formatDate(
    value
  ) {
    if (!value) {
      return "—";
    }

    return new Date(
      value
    ).toLocaleTimeString(
      "en-KE",
      {
        hour:
          "2-digit",
        minute:
          "2-digit"
      }
    );
  }

  async function logout() {

    try {
      await api(
        "/api/auth/logout",
        {
          method:
            "POST"
        }
      );
    } finally {
      window.location.href =
        "/";
    }
  }

  loadUser()
    .then(
      loadHistory
    );
</script>

</body>
</html>
