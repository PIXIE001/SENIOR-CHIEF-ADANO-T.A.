<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.C.A.G.S.S Staff Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf6ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.15);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0878c9, #004b87);
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      background: white;
      color: #0878c9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .header h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      opacity: .9;
    }

    .content {
      padding: 25px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #edf5fb;
      color: #17679b;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #0878c9;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd9e2;
      border-radius: 10px;
      outline: none;
      margin-bottom: 17px;
      font-size: 15px;
    }

    input:focus {
      border-color: #0878c9;
      box-shadow: 0 0 0 3px rgba(8,120,201,.1);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0878c9;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .6;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #ffe9e9;
      color: #a00000;
      border: 1px solid #ffbcbc;
    }

    .message.success {
      background: #e9fff1;
      color: #087238;
      border: 1px solid #a9e9bd;
    }

    .message.info {
      background: #eaf5ff;
      color: #07588f;
      border: 1px solid #acd5f2;
    }

    .footer {
      text-align: center;
      padding: 15px;
      color: #777;
      font-size: 12px;
      border-top: 1px solid #eee;
    }

    .small {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">SAG</div>
    <h1>S.C.A.G.S.S STAFF PORTAL</h1>
    <p>Senior Chief Adano Girls Senior School</p>
  </div>

  <div class="content">

    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">
        STAFF LOGIN
      </button>

      <button class="tab" id="registerTab" type="button">
        REGISTER
      </button>
    </div>

    <div id="message" class="message"></div>

    <!-- LOGIN -->
    <form id="loginForm" class="form active">

      <label>Username or Email</label>
      <input
        id="login"
        type="text"
        placeholder="Enter username or email"
        autocomplete="username"
        required
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" class="btn" type="submit">
        SIGN IN
      </button>

      <div class="small">
        Teachers must be approved by the administrator before login.
      </div>

    </form>


    <!-- REGISTRATION -->
    <form id="registerForm" class="form">

      <label>Full Name</label>
      <input
        id="fullName"
        type="text"
        placeholder="Enter your full name"
        required
      >

      <label>Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your actual email"
        required
      >

      <label>Phone Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="Enter your phone number"
        required
      >

      <label>Password</label>
      <input
        id="regPassword"
        type="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label>Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm password"
        minlength="6"
        required
      >

      <button id="registerBtn" class="btn" type="submit">
        REGISTER
      </button>

      <div class="small">
        Your registration will be sent to the administrator for approval.
      </div>

    </form>

  </div>

  <div class="footer">
    S.C.A.G.S.S Staff Attendance Management System
  </div>

</div>


<script>

  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");

  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");

  const message = document.getElementById("message");

  function showMessage(text, type = "info") {
    message.textContent = text;
    message.className = "message show " + type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "message";
  }

  loginTab.addEventListener("click", function () {
    clearMessage();

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    loginForm.classList.add("active");
    registerForm.classList.remove("active");
  });


  registerTab.addEventListener("click", function () {
    clearMessage();

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    registerForm.classList.add("active");
    loginForm.classList.remove("active");
  });


  // LOGIN
  loginForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const loginBtn = document.getElementById("loginBtn");

    const login = document.getElementById("login").value.trim();
    const password = document.getElementById("password").value;

    if (!login || !password) {
      showMessage("Please enter your username and password.", "error");
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "SIGNING IN...";

    showMessage("Connecting to the S.C.A.G.S.S server...", "info");

    try {

      const response = await fetch("/api/auth/login", {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          login: login,
          password: password
        })
      });

      const text = await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error(
          "The server returned an unexpected response. HTTP " +
          response.status
        );
      }

      if (!response.ok) {
        throw new Error(
          data.message ||
          data.error ||
          "Login failed. HTTP " + response.status
        );
      }

      if (!data.success) {
        throw new Error(
          data.message ||
          "Login was not successful."
        );
      }

      showMessage("Login successful. Opening your dashboard...", "success");

      const role = String(
        data.user && data.user.role
          ? data.user.role
          : ""
      ).trim().toLowerCase();

      setTimeout(function () {

        if (role === "admin") {
          window.location.href = "/admin.html";
        } else {
          window.location.href = "/staff.html";
        }

      }, 500);

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Unable to connect to the server.",
        "error"
      );

      loginBtn.disabled = false;
      loginBtn.textContent = "SIGN IN";
    }

  });


  // TEACHER REGISTRATION
  registerForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const registerBtn = document.getElementById("registerBtn");

    const full_name =
      document.getElementById("fullName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const password =
      document.getElementById("regPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {
      showMessage("Passwords do not match.", "error");
      return;
    }

    if (password.length < 6) {
      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );
      return;
    }


    registerBtn.disabled = true;
    registerBtn.textContent = "REGISTERING...";

    showMessage(
      "Submitting your registration...",
      "info"
    );


    try {

      const response = await fetch("/api/auth/register", {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          full_name: full_name,
          email: email,
          phone: phone,
          password: password
        })
      });


      const text = await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error(
          "The server returned an unexpected response. HTTP " +
          response.status
        );
      }


      if (!response.ok) {
        throw new Error(
          data.message ||
          data.error ||
          "Registration failed."
        );
      }


      showMessage(
        data.message ||
        "Registration successful. Your account is waiting for administrator approval.",
        "success"
      );


      registerForm.reset();


      setTimeout(function () {

        loginTab.click();

      }, 2500);


    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Unable to connect to the server.",
        "error"
      );

    } finally {

      registerBtn.disabled = false;
      registerBtn.textContent = "REGISTER";

    }

  });

</script>

</body>
</html>
