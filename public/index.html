<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.C.A.G.S.S Staff Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf6ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 28px;
      box-shadow: 0 15px 45px rgba(0, 70, 130, 0.15);
      border: 1px solid #dceeff;
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #0784d8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #075b96;
      font-size: 24px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #667788;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #174b6d;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #c8ddeb;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #0784d8;
      box-shadow: 0 0 0 3px rgba(7, 132, 216, 0.1);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0784d8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #056bab;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .error {
      display: block !important;
      background: #ffecec;
      color: #b42318;
    }

    .success {
      display: block !important;
      background: #eafaf0;
      color: #18794e;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #8092a0;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">SAG</div>

    <h1>S.C.A.G.S.S</h1>

    <div class="subtitle">
      Staff Attendance Portal
    </div>

    <form id="loginForm">

      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        placeholder="Enter username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        LOGIN
      </button>

    </form>

    <div id="message"></div>

    <div class="footer">
      S.C.A.G.S.S Staff Attendance Management System
    </div>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showMessage("Enter your username and password.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "LOGGING IN...";
      message.className = "";
      message.textContent = "";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Login failed.");
        }

        showMessage("Login successful. Opening portal...", "success");

        setTimeout(() => {
          if (data.user.role === "admin") {
            window.location.href = "/admin.html";
          } else {
            window.location.href = "/staff.html";
          }
        }, 500);

      } catch (error) {
        showMessage(error.message || "Unable to connect to the server.", "error");

        button.disabled = false;
        button.textContent = "LOGIN";
      }
    });
  </script>

</body>
</html>
