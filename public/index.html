<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S.C.A.G.S.S Staff Portal</title>

<meta name="theme-color" content="#0b5ed7">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eaf4ff,#ffffff);
  color:#17324d;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:460px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 50px rgba(0,0,0,.12);
  border:1px solid #dcecff;
}

.logo{
  width:76px;
  height:76px;
  border-radius:50%;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b5ed7;
  color:white;
  font-weight:900;
  font-size:23px;
  box-shadow:0 10px 25px rgba(11,94,215,.3);
}

h1{
  text-align:center;
  margin:0;
  font-size:25px;
  color:#084b9b;
}

.subtitle{
  text-align:center;
  color:#6a7f95;
  margin:8px 0 24px;
  font-size:14px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  background:#eef6ff;
  padding:6px;
  border-radius:12px;
  margin-bottom:22px;
}

.tab{
  border:0;
  padding:12px;
  border-radius:9px;
  background:transparent;
  color:#50708f;
  font-weight:700;
  cursor:pointer;
}

.tab.active{
  background:#0b5ed7;
  color:#fff;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:14px 0 7px;
  color:#36546f;
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid #cbdced;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#0b5ed7;
  box-shadow:0 0 0 3px rgba(11,94,215,.1);
}

button.primary{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#0b5ed7;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

button.primary:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.5;
}

.message.show{
  display:block;
}

.message.success{
  background:#e9f9ef;
  color:#176b39;
  border:1px solid #bde8ca;
}

.message.error{
  background:#fff0f0;
  color:#9a2525;
  border:1px solid #f0c3c3;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#8193a5;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">SAG</div>

    <h1>S.C.A.G.S.S</h1>

    <div class="subtitle">
      Staff Attendance Portal
    </div>

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showForm('login')">
        STAFF LOGIN
      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showForm('register')">
        REGISTER
      </button>

    </div>

    <!-- LOGIN -->

    <form
      id="loginForm"
      class="form active"
      onsubmit="login(event)">

      <label>Username or Email</label>

      <input
        id="login"
        type="text"
        placeholder="Enter username or email"
        autocomplete="username"
        required>

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required>

      <button
        class="primary"
        id="loginButton"
        type="submit">
        LOGIN
      </button>

    </form>

    <!-- REGISTER -->

    <form
      id="registerForm"
      class="form"
      onsubmit="registerStaff(event)">

      <label>Full Name</label>

      <input
        id="full_name"
        type="text"
        placeholder="Enter full name"
        required>

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter email"
        required>

      <label>Phone Number</label>

      <input
        id="phone"
        type="tel"
        placeholder="Enter phone number"
        required>

      <label>Password</label>

      <input
        id="regPassword"
        type="password"
        placeholder="Create password"
        minlength="6"
        required>

      <button
        class="primary"
        id="registerButton"
        type="submit">
        CREATE STAFF ACCOUNT
      </button>

    </form>

    <div
      id="message"
      class="message">
    </div>

    <div class="footer">
      S.C.A.G.S.S Staff Attendance Portal
      <br>
      GPS-verified staff attendance
    </div>

  </div>

</div>

<script>

function showForm(type){

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  if(type === "login"){

    loginForm.classList.add("active");
    registerForm.classList.remove("active");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

  }else{

    registerForm.classList.add("active");
    loginForm.classList.remove("active");

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

  }

  clearMessage();
}

function showMessage(
  text,
  type="error"
){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    `message show ${type}`;

}

function clearMessage(){

  const box =
    document.getElementById("message");

  box.className =
    "message";

  box.textContent = "";

}

async function login(event){

  event.preventDefault();

  clearMessage();

  const button =
    document.getElementById("loginButton");

  button.disabled = true;
  button.textContent = "LOGGING IN...";

  try{

    const response =
      await fetch(
        "/api/auth/login",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          credentials:"include",
          body:JSON.stringify({
            login:
              document
                .getElementById("login")
                .value
                .trim(),

            password:
              document
                .getElementById("password")
                .value
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      showMessage(
        data.message ||
        "Login failed."
      );

      return;
    }

    showMessage(
      "Login successful. Opening portal...",
      "success"
    );

    setTimeout(() => {

      if(
        String(
          data.user?.role || ""
        ).toLowerCase()
        === "admin"
      ){

        window.location.href =
          "/admin.html";

      }else{

        window.location.href =
          "/staff.html";

      }

    },500);

  }catch(error){

    showMessage(
      "Unable to connect to the server."
    );

  }finally{

    button.disabled = false;
    button.textContent = "LOGIN";

  }
}

async function registerStaff(event){

  event.preventDefault();

  clearMessage();

  const button =
    document.getElementById(
      "registerButton"
    );

  button.disabled = true;
  button.textContent =
    "CREATING ACCOUNT...";

  try{

    const response =
      await fetch(
        "/api/auth/register",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          credentials:"include",
          body:JSON.stringify({

            full_name:
              document
                .getElementById(
                  "full_name"
                )
                .value
                .trim(),

            email:
              document
                .getElementById(
                  "email"
                )
                .value
                .trim(),

            phone:
              document
                .getElementById(
                  "phone"
                )
                .value
                .trim(),

            password:
              document
                .getElementById(
                  "regPassword"
                )
                .value

          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      showMessage(
        data.message ||
        "Registration failed."
      );

      return;
    }

    showMessage(
      `Registration successful. Your username is ${data.username}. Please wait for administrator approval.`,
      "success"
    );

    document
      .getElementById("registerForm")
      .reset();

  }catch(error){

    showMessage(
      "Unable to connect to the server."
    );

  }finally{

    button.disabled = false;
    button.textContent =
      "CREATE STAFF ACCOUNT";

  }
}

</script>

</body>
</html>
